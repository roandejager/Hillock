[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hillock"
version = "1.0.2"
description = "A lightweight, 100% local neuro-symbolic memory engine."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "onnxruntime>=1.16.0",
    "psutil>=5.9.0",
    "pypdf>=3.17.0",
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "fastcoref>=2.1.0",
    "glirel>=0.1.0",
    "sentence-transformers>=2.2.2",
    "spacy>=3.5.0",
    "loguru",
    "tiktoken",
    "sentencepiece",
    "protobuf",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0"
]

[project.optional-dependencies]
onnx-export = [
    "onnx>=1.14.0",
    "onnxconverter-common>=1.13.0"
]

[project.scripts]
hillock = "main:run_cli"